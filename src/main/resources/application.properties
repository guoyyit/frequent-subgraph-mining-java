# ============================================================
# 频繁子图挖掘服务配置（前缀 mining.*）
# ============================================================

# 持久化目录（图目录 WAL、快照与各挖掘域增量状态）
mining.storage-dir=${user.dir}/data/mining

# 默认挖掘参数（可被每次查询/提交请求覆盖）
mining.default-min-support=1
mining.default-max-pattern-edges=5
mining.default-max-results=1000
mining.default-max-embeddings-per-pattern=100

# 输入图规模上限（组合爆炸保护）
mining.max-nodes-per-graph=50
mining.max-edges-per-graph=200

# 默认执行时间上限（毫秒）
mining.default-timeout-millis=10000

# 每个挖掘域累计多少次增量事务后触发一次快照压缩
mining.compact-threshold=50

spring.servlet.multipart.max-request-size=10MB
